name: CI
on:
  pull_request:
  # Merge queue: the required checks run on the queue's merge commit.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Decides whether the fast path applies: only the script's verdict counts (never
  # labels, branch names or authors). No secrets. A merge group can batch several
  # PRs, so its whole base..head range must be release-only.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_only: ${{ steps.r.outputs.release_only }}
      base: ${{ steps.r.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: r
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -u
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "not a pull request or merge group: full CI"
            echo "release_only=false" >> "$GITHUB_OUTPUT"
          elif out=$(node --experimental-strip-types scripts/ci/release-only.ts "$BASE_SHA" "$HEAD_SHA"); then
            echo "$out"
            echo "release_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "full CI: $out"
            echo "release_only=false" >> "$GITHUB_OUTPUT"
          fi
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: version-consistency (package.json, release manifest, CHANGELOG)
        run: node --experimental-strip-types scripts/ci/version-consistency.ts
      - name: actionlint (runs shellcheck on run blocks)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          command -v shellcheck
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -color .github/workflows/*.yml
  typecheck:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: release-only
        if: ${{ needs.changes.outputs.release_only == 'true' }}
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: |
          echo "release-only change: skipped (main passed full CI at $BASE_SHA)"
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - uses: pnpm/action-setup@v4
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ needs.changes.outputs.release_only != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - run: pnpm typecheck
        if: ${{ needs.changes.outputs.release_only != 'true' }}
  test:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: release-only
        if: ${{ needs.changes.outputs.release_only == 'true' }}
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: |
          echo "release-only change: skipped (main passed full CI at $BASE_SHA)"
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - uses: pnpm/action-setup@v4
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ needs.changes.outputs.release_only != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - run: pnpm test
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      # Wall-clock CPU budgets, serial (not under the parallel suite's load).
      - run: pnpm --filter @oa/server test:cpu
        if: ${{ needs.changes.outputs.release_only != 'true' }}
  build:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: release-only
        if: ${{ needs.changes.outputs.release_only == 'true' }}
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: |
          echo "release-only change: skipped (main passed full CI at $BASE_SHA)"
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - uses: pnpm/action-setup@v4
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ needs.changes.outputs.release_only != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - run: pnpm build
        if: ${{ needs.changes.outputs.release_only != 'true' }}
  # No secrets: the real suite runs a local `wrangler dev` (ENVIRONMENT=dev in a
  # generated temp config), never staging.
  e2e:
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    steps:
      - name: release-only
        if: ${{ needs.changes.outputs.release_only == 'true' }}
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: |
          echo "release-only change: skipped (main passed full CI at $BASE_SHA)"
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - uses: pnpm/action-setup@v4
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ needs.changes.outputs.release_only != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - id: pw
        run: bash scripts/ci/e2e.sh version
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - uses: actions/cache@v4
        if: ${{ needs.changes.outputs.release_only != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.playwright }}
      - id: install
        run: bash scripts/ci/e2e.sh install
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - run: bash scripts/ci/e2e.sh hosts
        if: ${{ needs.changes.outputs.release_only != 'true' }}
      - name: Mock suite
        if: ${{ needs.changes.outputs.release_only != 'true' }}
        run: bash scripts/ci/e2e.sh mock
      # Runs even when the mock suite failed (not when the browsers didn't install).
      - name: Real-server suite (local wrangler dev)
        if: ${{ !cancelled() && needs.changes.outputs.release_only != 'true' && steps.install.outcome == 'success' }}
        run: bash scripts/ci/e2e.sh real
      - name: UI real-browser checks (axe contrast, focus)
        if: ${{ !cancelled() && needs.changes.outputs.release_only != 'true' && steps.install.outcome == 'success' }}
        run: bash scripts/ci/e2e.sh ui
      - name: Landing real-browser checks (no horizontal overflow)
        if: ${{ !cancelled() && needs.changes.outputs.release_only != 'true' && steps.install.outcome == 'success' }}
        run: bash scripts/ci/e2e.sh landing
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/dashboard/playwright-report
            apps/dashboard/test-results
          retention-days: 14
  # Not a required check: skipped unless a release-config file changed.
  release-dry-run:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qxE 'release-please-config\.json|\.release-please-manifest\.json|\.github/workflows/release-please\.yml|biome\.json|CHANGELOG\.md'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      # release-please 17.3.0 = version locked by googleapis/release-please-action v4.4.1 (package-lock.json)
      - if: steps.changed.outputs.run == 'true'
        env:
          RD_TOKEN: ${{ github.token }}
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/rp" release-please@17.3.0
          RELEASE_PLEASE="$RUNNER_TEMP/rp/node_modules/.bin/release-please" bash scripts/ci/release-dry-run.sh
