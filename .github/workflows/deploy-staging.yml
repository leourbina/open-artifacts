name: Deploy staging
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: mkdir -p apps/dashboard/dist && [ -f apps/dashboard/dist/index.html ] || echo '<!doctype html><title>Open Artifacts</title>' > apps/dashboard/dist/index.html
      - name: preflight (required Worker secrets)
        working-directory: apps/server
        run: |
          set -o pipefail
          pnpm exec wrangler secret list -c wrangler.staging.jsonc --env staging --format json | node ../../scripts/ops/check-staging-secrets.ts
      - name: clear Worker secrets that are also staging vars
        working-directory: apps/server
        run: |
          set -o pipefail
          names=$(pnpm exec wrangler secret list -c wrangler.staging.jsonc --env staging --format json | node ../../scripts/ops/conflicting-secrets.ts)
          for name in $names; do
            echo "deleting conflicting secret: $name"
            echo y | pnpm exec wrangler secret delete "$name" -c wrangler.staging.jsonc --env staging > /dev/null
          done
      - run: pnpm --filter @oa/server exec wrangler d1 migrations apply open-artifacts-staging --remote -c wrangler.staging.jsonc --env staging
      - run: pnpm --filter @oa/server exec wrangler deploy -c wrangler.staging.jsonc --env staging
  smoke:
    needs: [deploy]
    runs-on: ubuntu-latest
    env:
      STAGING_URL: https://staging.open-artifacts.com
      STAGING_OWNER_PAT: ${{ secrets.STAGING_OWNER_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: healthz
        run: |
          body=$(curl -fsS --retry 20 --retry-delay 5 --retry-max-time 180 --retry-all-errors https://staging.open-artifacts.com/healthz)
          echo "$body"
          grep -q '"ok":true' <<< "$body"
      - name: robots
        run: |
          headers=$(curl -fsS -D - -o robots.body --retry 20 --retry-delay 5 --retry-max-time 180 --retry-all-errors https://staging.open-artifacts.com/robots.txt)
          body=$(cat robots.body)
          grep -iq '^x-robots-tag: noindex, nofollow' <<< "$headers"
          grep -q 'Disallow: /' <<< "$body"
      - name: robots (content host)
        run: |
          headers=$(curl -fsS -D - -o robots.body --retry 20 --retry-delay 5 --retry-max-time 180 --retry-all-errors https://staging-content.open-artifacts.com/robots.txt)
          body=$(cat robots.body)
          grep -iq '^x-robots-tag: noindex, nofollow' <<< "$headers"
          grep -q 'Disallow: /' <<< "$body"
      - name: auth login redirects to Access
        run: |
          team=$(sed -n 's/.*"ACCESS_TEAM_DOMAIN": *"\([^"]*\)".*/\1/p' apps/server/wrangler.staging.jsonc | head -1)
          [ -n "$team" ] || { echo "::error::ACCESS_TEAM_DOMAIN not found in wrangler.staging.jsonc"; exit 1; }
          # keep only the last response's headers (retries append blocks)
          headers=$(curl -fsS -D - -o /dev/null --retry 20 --retry-delay 5 --retry-max-time 180 --retry-all-errors https://staging.open-artifacts.com/auth/login | tr -d '\r' | awk 'BEGIN{RS="";ORS="\n"} {b=$0} END{print b}')
          echo "$headers"
          status=$(head -1 <<< "$headers")
          case "$status" in HTTP/*" 302"*) ;; *) echo "::error::/auth/login did not return 302 ($status)"; exit 1 ;; esac
          loc=$(grep -i '^location:' <<< "$headers" | head -1 | sed 's/^[^:]*: *//')
          prefix="https://$team/cdn-cgi/access/sso/oidc/"
          [ "${loc#"$prefix"}" != "$loc" ] || { echo "::error::/auth/login Location does not start with $prefix"; exit 1; }
      - run: pnpm --filter @oa/server smoke
