name: Landing preview
on:
  pull_request:
    paths:
      - apps/landing/**
permissions:
  contents: read
  pull-requests: write
jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Steps skip cleanly until apps/landing has a Worker config.
      - if: ${{ hashFiles('apps/landing/wrangler.jsonc') != '' }}
        run: pnpm --filter @oa/landing build
      - id: upload
        if: ${{ hashFiles('apps/landing/wrangler.jsonc') != '' }}
        working-directory: apps/landing
        run: |
          pnpm exec wrangler versions upload | tee upload.log
          url=$(grep -oE 'https://[^ ]+workers\.dev[^ ]*' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        if: ${{ hashFiles('apps/landing/wrangler.jsonc') != '' }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: 'Landing preview: ${{ steps.upload.outputs.url }}',
            });
