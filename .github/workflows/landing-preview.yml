name: Landing preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - apps/landing/**
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: landing-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          if [ -f apps/landing/wrangler.jsonc ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.present == 'true'
        run: pnpm --filter @oa/landing build
      - id: preview
        if: steps.gate.outputs.present == 'true'
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler preview --name pr-${{ github.event.pull_request.number }} --json > preview.json
          url=$(jq -er '.preview.urls[0]' preview.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        if: steps.gate.outputs.present == 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- landing-preview -->';
            const body = `${marker}\nLanding preview: ${process.env.PREVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          if [ -f apps/landing/wrangler.jsonc ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.present == 'true'
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler preview delete --name pr-${{ github.event.pull_request.number }} --skip-confirmation
