name: Landing preview
on:
  pull_request:
    paths:
      - apps/landing/**
permissions:
  contents: read
  pull-requests: write
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          if [ -f apps/landing/wrangler.jsonc ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.present == 'true'
        run: pnpm --filter @oa/landing build
      - id: upload
        if: steps.gate.outputs.present == 'true'
        working-directory: apps/landing
        run: |
          pnpm exec wrangler versions upload | tee upload.log
          url=$(grep -oE 'https://[^ ]+workers\.dev[^ ]*' upload.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        if: steps.gate.outputs.present == 'true'
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: url ? `Landing preview: ${url}` : 'Landing preview uploaded (URL not detected).',
            });
