name: Ops - demo first install
# The public demo (demo.open-artifacts.com) runs on the staging Cloudflare credentials,
# never a PROD secret. Dispatch only, from main.
# TODO(#299): the demo should raise RL_ANON and ANON_WRITES_PER_MIN to 120. oa:setup has no
# flag or var for either on main yet; once #299 lands, set them here (or as a wrangler var).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run demo setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OA_ACCESS_TOKEN: ${{ secrets.DEMO_OA_ACCESS_TOKEN }}
        run: >-
          pnpm -s oa:setup --ci --json
          --name open-artifacts-demo --app-host demo.open-artifacts.com
          --content-host demo-content.open-artifacts.com --owner-email me@leourbina.com
          --solo --no-email --yes-paid
      - name: Revoke leaked setup-ci tokens
        if: always()
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OA_ACCESS_TOKEN: ${{ secrets.DEMO_OA_ACCESS_TOKEN }}
        run: >-
          pnpm -s oa:setup --ci --revoke-ci-tokens
          --name open-artifacts-demo --app-host demo.open-artifacts.com
          --content-host demo-content.open-artifacts.com --owner-email me@leourbina.com
