name: Ops - staging Access setup
on:
  workflow_dispatch:
    inputs:
      team_name:
        description: Zero Trust team name (fallback if the organizations API is unavailable)
        type: string
        default: leourbina
      force_rotate:
        description: Regenerate SESSION_SECRET and CONTENT_SIGNING_KEY
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: staging-access
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision Access app and Worker secrets
        env:
          TEAM_NAME: ${{ inputs.team_name }}
          FORCE_ROTATE: ${{ inputs.force_rotate }}
        run: node scripts/ops/staging-access.ts
