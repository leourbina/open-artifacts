name: release-cadence
# Arms the release-please PR once it is green and the merge queue has drained, and
# keeps one `blocker` issue open while a release is stuck. A manual cut still works:
# arm the release PR yourself at any time.
on:
  # The retry loop: every 10 minutes (also covers the daily 15:00 pass), plus right
  # after CI and release-please finish. (check_suite does not fire for Actions suites.)
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [release-please, CI]
    types: [completed]
permissions: {}
concurrency:
  group: release-cadence
  cancel-in-progress: false
jobs:
  cadence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Read-only: does arming need to touch the release PR at all?
      - id: plan
        name: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/release-cadence.ts plan --repo "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      # The App token exists only right before arming, scoped to the PR merge:
      # merging with GITHUB_TOKEN would trigger no workflows on the merge commit.
      - id: app
        if: ${{ steps.plan.outputs.write == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: write
      - name: arm
        if: ${{ steps.plan.outputs.write == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node --experimental-strip-types scripts/ci/release-cadence.ts arm --repo "$GITHUB_REPOSITORY"
      - name: blocker
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/release-cadence.ts blocker --repo "$GITHUB_REPOSITORY"
